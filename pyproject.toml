[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "relational-transformer"
version = "1.10.0"
description = "Relational Transformer (RT): a foundation model for relational data, bundling a native Rust data-processing engine (rt.rustler)."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "einops",
    "huggingface-hub<2",
    "ml_dtypes",
    "numpy",
    "orjson",
    "pandas",
    "polars",
    "pyarrow",
    "pyyaml",
    "safetensors",
    "scikit-learn",
    "sentence-transformers",
    "torch",
    "wandb",
]

[project.urls]
Homepage = "https://star-project.stanford.edu/rt-j"
Repository = "https://github.com/stanford-star/relational-transformer"
Issues = "https://github.com/stanford-star/relational-transformer/issues"

[tool.maturin]
python-source = "src"
manifest-path = "rustler/Cargo.toml"
module-name = "rt.rustler"
features = ["pyo3/extension-module"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.activation]
scripts = ["activate.sh"]

[tool.pixi.activation.env]
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "x86_64-conda-linux-gnu-cc"

[tool.pixi.dependencies]
python = "3.12.*"
rust = "*"
maturin = "*"
uv = "*"
pre-commit = "*"
ruff = "*"

[tool.pixi.pypi-dependencies]
relational-transformer = { path = ".", editable = true }
# CUDA 12.4 build, for drivers that predate newer CUDA wheels. 2.6.0 is the last
# release on the cu124 index and the first with the torch.nn.utils
# get_total_norm / clip_grads_with_norm_ that rt.train calls.
torch = { version = "==2.6.0", index = "https://download.pytorch.org/whl/cu124" }
# The DuckDB release rustler's duckdb crate bundles (1.10506.x), so files
# examples/preprocess/to_duckdb.py writes open on the Rust side.
duckdb = "==1.5.6"
relbench = { git = "https://github.com/stanford-star/relbench", rev = "bac62c99cf1a60fbfd7c61c5fd7cb183453b7997" }
roach = { git = "https://github.com/rishabh-ranjan/roach", branch = "main" }

[tool.ruff]
extend-exclude = ["expts", "local", "rustler/target"]
force-exclude = true

[tool.ruff.format]
exclude = ["*.md", "*.ipynb"]
